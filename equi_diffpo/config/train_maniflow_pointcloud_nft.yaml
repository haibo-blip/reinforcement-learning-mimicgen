defaults:
  - _self_
  - task: mimicgen_pc_abs_rl

name: train_maniflow_pointcloud_nft
_target_: equi_diffpo.rl_training.rl_workspace.RLTrainingWorkspace

# Reference the task configuration
shape_meta: ${task.shape_meta}
exp_name: "maniflow_pc_nft"

task_name: nut_assembly_d0
n_demo: 1000
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}

# Dataset path (required by env_runner configuration)
dataset_target: equi_diffpo.dataset.robomimic_replay_point_cloud_dataset.RobomimicReplayPointCloudDataset
dataset_path: equi_diffpo/data/robomimic/datasets/${task_name}/${task_name}_voxel_abs.hdf5

# Policy configuration (same architecture as PPO version)
policy:
  _target_: equi_diffpo.policy.maniflow.maniflow_pointcloud_rl_policy.ManiFlowRLPointcloudPolicy
  checkpoint: null  # Set via command line: policy.checkpoint=path/to/pretrained.ckpt
  # ManiFlow parameters
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 9
  obs_as_global_cond: True

  # DiTX Transformer architecture
  n_layer: 12
  n_head: 8
  n_emb: 768
  visual_cond_len: 1024
  qkv_bias: True
  qk_norm: True
  block_type: "DiTX"
  language_conditioned: False

  # Flow model parameters
  diffusion_timestep_embed_dim: 128
  diffusion_target_t_embed_dim: 128

  # RL exploration noise (disabled for NFT - deterministic rollout)
  noise_level: 0.0
  noise_anneal: false
  noise_params: [0.1, 0.2, 100]

  # Point cloud encoder parameters
  encoder_type: "DP3Encoder"
  crop_shape: null
  encoder_output_dim: 128
  shape_meta: ${shape_meta}

  use_pc_color: true
  pointnet_type: "pointnet"
  downsample_points: true

  # Canonicalization
  use_canonicalization: false
  canonicalization_mode: "se3"

  # Not using FPO/PPO loss modes (NFT has its own loss)
  loss_mode: "gaussian"

  pointcloud_encoder_cfg:
    in_channels: 6
    out_channels: ${policy.encoder_output_dim}
    use_layernorm: true
    final_norm: layernorm
    normal_channel: false
    num_points: ${policy.visual_cond_len}
    pointwise: true

# RL Training Configuration (NFT)
rl_training:
  # Trainer type: "nft" to use ManiFlowNFTTrainer
  trainer_type: "nft"

  # Core training parameters
  total_timesteps: 2000000
  num_envs: 16
  batch_size: 16
  gradient_accumulate_every: 128  # accumulate 128 minibatches per optimizer step

  # Learning rates
  learning_rate: 1.0e-5      # Actor LR (~pretrain/10)
  value_lr: 1.0e-4           # Critic LR (10x actor)
  max_grad_norm: 0.5

  # NFT-specific parameters
  beta: 1.0                  # NFT blend strength (1.0 = conservative)
  beta_kl: 0.0001            # KL regularization weight (same as DiffusionNFT)
  adv_clip_max: 5.0          # Advantage clipping range
  old_model_decay: 0.5       # Max EMA decay for old_model
  old_model_decay_rate: 0.001  # Decay ramp-up rate per rollout

  # Critic parameters
  value_coef: 0.5
  clip_range: 0.2            # Value clipping range

  # GAE parameters (unchanged from PPO)
  gamma: 0.99
  gae_lambda: 0.95

  # Learning rate schedule
  lr_schedule: "linear"
  warmup_steps: 10000

  # Logging and checkpointing
  eval_interval: 3
  log_interval: 10
  save_interval: 100

  # Rollout video logging
  rollout_video_interval: 20
  n_rollout_videos: 4

  # Episode counts
  train_n_episodes: 500
  eval_n_episodes: 50

  # Critic warmup (train value head before actor)
  critic_warmup_rollouts: 4
  critic_warmup_epochs: 3

# Training configuration
training:
  device: "cuda:0"
  seed: 42

# Logging configuration
logging:
  project: maniflow_pointcloud_nft_${task_name}
  resume: True
  mode: online
  name: ${name}_${task_name}_nft
  tags: ["${name}", "${task_name}", "${exp_name}", "nft"]
  id: null
  group: ${exp_name}

# Checkpoint configuration
checkpoint:
  save_ckpt: True
  topk:
    monitor_key: rl_mean_episode_reward
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-reward={rl_mean_episode_reward:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

# Output configuration
multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
